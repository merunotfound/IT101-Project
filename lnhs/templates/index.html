<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LNHS Learner Information System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="hero">
  <img src="{{ url_for('static', filename='images/cover.jpg') }}" alt="Ligao National High School" class="hero-img">
</header>

<div class="app-bar">
  <div class="app-bar-inner">
    <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="LNHS Seal" class="app-logo">
    <div class="app-bar-text">
      <h1>Learner Information System</h1>
      <p class="app-sub">Keeping every learner's record accurate, organized, and easy to find.</p>
    </div>
  </div>
</div>

<main>

  <!-- Enrollment summary for the selected school year -->
  <section aria-label="Enrollment summary">
    <div class="cards" id="cards"></div>
  </section>

  <section class="sections-panel" id="sectionsPanel" hidden aria-label="Section headcounts">
    <h2 class="panel-title">Sections <span class="panel-note" id="sectionsNote"></span></h2>
    <div class="section-grid" id="sectionGrid"></div>
  </section>

  <!-- Search, filters, actions -->
  <div class="toolbar">
    <div class="search-field">
      <input type="text" id="searchInput" placeholder="Search by LRN, name, section, guardian, or address" autocomplete="off">
    </div>
    <div class="filters">
      <label class="filter">
        <span>School year</span>
        <select id="schoolYearFilter"></select>
      </label>
      <label class="filter">
        <span>Status</span>
        <select id="statusFilter"></select>
      </label>
    </div>
    <div class="toolbar-actions">
      <button class="btn btn-quiet" id="exportBtn">Export CSV</button>
      <button class="btn btn-primary" id="addBtn">Add learner</button>
    </div>
  </div>

  <div id="statusLine" class="status-line" aria-live="polite"></div>

  <div class="table-wrap">
    <table class="ledger">
      <thead>
        <tr>
          <th data-sort="lrn" class="col-lrn">LRN</th>
          <th data-sort="name" class="col-name">Name</th>
          <th data-sort="grade_level" class="col-grade">Grade &amp; Section</th>
          <th data-sort="age" class="col-age">Age</th>
          <th data-sort="status" class="col-status">Status</th>
          <th data-sort="requirements_done" class="col-reqs">Requirements</th>
          <th class="col-guardian">Guardian</th>
          <th class="col-actions"></th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- rows injected by script.js -->
      </tbody>
    </table>
  </div>

  <div id="emptyState" class="empty-state" hidden>
    <p>No records yet.</p>
    <button class="btn btn-primary" id="emptyAddBtn">Add the first learner</button>
  </div>
</main>

<!-- Add / Edit dialog -->
<div id="overlay" class="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <h2 id="dialogTitle">Add learner</h2>
    <form id="learnerForm" novalidate>

      <fieldset class="group">
        <legend>Learner</legend>
        <div class="field-row">
          <div class="field">
            <label for="fieldLrn">LRN (12 digits)</label>
            <input type="text" id="fieldLrn" inputmode="numeric" maxlength="12" required>
          </div>
          <div class="field">
            <label for="fieldSex">Sex</label>
            <select id="fieldSex" required>
              <option value="">Select…</option>
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="fieldName">Full Name</label>
          <input type="text" id="fieldName" required>
        </div>
        <div class="field">
          <label for="fieldBirthdate">Birthdate</label>
          <input type="date" id="fieldBirthdate" required>
        </div>
        <div class="field">
          <label for="fieldAddress">Home Address</label>
          <input type="text" id="fieldAddress" required>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Enrollment</legend>
        <div class="field-row">
          <div class="field">
            <label for="fieldSchoolYear">School Year</label>
            <input type="text" id="fieldSchoolYear" list="schoolYearList" placeholder="2026-2027" required>
            <datalist id="schoolYearList"></datalist>
          </div>
          <div class="field">
            <label for="fieldLearnerType">Learner Type</label>
            <select id="fieldLearnerType" required></select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="fieldGradeLevel">Grade Level</label>
            <input type="number" id="fieldGradeLevel" min="7" max="12" step="1" required>
          </div>
          <div class="field">
            <label for="fieldSection">Section</label>
            <input type="text" id="fieldSection" required>
          </div>
        </div>
        <div class="field">
          <label for="fieldStatus">Enrollment Status</label>
          <select id="fieldStatus" required></select>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Guardian</legend>
        <div class="field-row">
          <div class="field">
            <label for="fieldGuardianName">Guardian Name</label>
            <input type="text" id="fieldGuardianName" required>
          </div>
          <div class="field">
            <label for="fieldGuardianContact">Contact Number</label>
            <input type="text" id="fieldGuardianContact" inputmode="numeric" placeholder="09171234567" required>
          </div>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Requirements submitted</legend>
        <div class="checklist" id="requirementsList"></div>
      </fieldset>

      <p id="formError" class="form-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-quiet" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
